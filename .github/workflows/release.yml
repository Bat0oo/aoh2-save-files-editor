name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install javaobj-py3 pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name AoH2SaveEditor aoh2_editor.py

      - name: Smoke test import
        run: python -c "import aoh2codec; print('codec import OK')"

      - name: Create release with exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AoH2SaveEditor.exe
          generate_release_notes: true
